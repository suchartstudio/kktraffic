<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khon Kaen Smart Traffic Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(16, 24, 39, 0.85);
            --border-color: #00e5ff;
            --text-main: #e0f2fe;
            --text-muted: #7dd3fc;
            --accent: #f97316;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        #dashboard {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
        }

        /* overlay panel on the map */
        .time-panel {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 30px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            text-align: center;
        }

        .time-panel h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .time-panel .clock {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--border-color);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
        }

        /* Sidebar table */
        #sidebar {
            width: 650px;
            height: 100%;
            background: var(--panel-bg);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            z-index: 1000;
            flex-shrink: 0;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(90deg, rgba(0,229,255,0.1) 0%, transparent 100%);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--border-color);
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: fixed;
        }

        th:nth-child(1), td:nth-child(1) { width: 45px; text-align: center; } 
        th:nth-child(2), td:nth-child(2) { width: 195px; text-align: left; }   
        th:nth-child(3), td:nth-child(3) { width: 85px; text-align: right; }  
        th:nth-child(4), td:nth-child(4) { width: 75px; text-align: right; }  
        th:nth-child(5), td:nth-child(5) { width: 75px; text-align: right; }  
        th:nth-child(6), td:nth-child(6) { width: 75px; text-align: right; }  

        th {
            background-color: rgba(0, 229, 255, 0.15);
            color: var(--border-color);
            padding: 12px 6px;
            position: sticky;
            top: 0;
            z-index: 2;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 10px 6px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.15);
            word-wrap: break-word;
        }

        tr:hover {
            background-color: rgba(0, 229, 255, 0.08);
        }

        .rank {
            font-weight: bold;
            color: var(--accent);
        }

        /* Custom Layer Control */
        .leaflet-control-layers {
            background: rgba(16, 24, 39, 0.9) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            font-family: 'Chakra Petch', sans-serif !important;
            border-radius: 6px !important;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2) !important;
        }
        .leaflet-control-layers-toggle {
            background-color: rgba(16, 24, 39, 0.9) !important;
            border-radius: 4px;
        }

        /* -------------------------------------------
           NEW: Marker & Text Styles (No Border Box) 
           ------------------------------------------- */
        .custom-sensor-icon {
            background: transparent;
            border: none;
        }
        .sensor-marker {
            display: flex;
            align-items: center;
            gap: 6px; /* ระยะห่างระหว่างจุดกับตัวเลข */
        }
        .sensor-dot {
            width: 12px;
            height: 12px;
            background-color: #00e5ff;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e5ff;
            flex-shrink: 0;
        }
        .sensor-text {
            color: #00e5ff;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            /* ตัดขอบดำให้ตัวหนังสือ เพื่อให้อ่านง่ายบนพื้นสว่างและมืด */
            text-shadow: 
                -1px -1px 0 #0b0f19,  
                 1px -1px 0 #0b0f19,
                -1px  1px 0 #0b0f19,
                 1px  1px 0 #0b0f19,
                 0 0 10px #00e5ff;
        }
        
        /* สไตล์เวลาจราจรหนาแน่น (เปลี่ยนเป็นสีแดง) */
        .sensor-marker.heavy .sensor-dot {
            background-color: #ff3d00;
            box-shadow: 0 0 10px #ff3d00;
        }
        .sensor-marker.heavy .sensor-text {
            color: #ff3d00;
            text-shadow: 
                -1px -1px 0 #0b0f19,  
                 1px -1px 0 #0b0f19,
                -1px  1px 0 #0b0f19,
                 1px  1px 0 #0b0f19,
                 0 0 10px #ff3d00;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* Custom Leaflet Popup */
        .leaflet-popup-content-wrapper {
            background: rgba(16, 24, 39, 0.95);
            color: #fff;
            border: 1px solid var(--border-color);
            font-family: 'Chakra Petch', sans-serif;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .leaflet-popup-tip { background: var(--border-color); }
        .popup-title { color: var(--border-color); font-weight: bold; margin-bottom: 5px; font-size: 1.1rem; }
        .popup-data { margin: 2px 0; color: #cbd5e1; }
        .popup-data span { color: var(--accent); font-weight: bold; }
    </style>
</head>

    const tbody = document.getElementById('table-body');
    trafficData.forEach(item => {
        let routeName = item['เส้นทาง'] || item['text'];
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="rank">${item['ที่']}</td>
            <td>
                <div style="font-weight:600; color:var(--text-main);">${routeName}</div>
                <div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">${item['ตำแหน่งติดตั้งเครื่องวัด (ตั้งกล้องนับถนนฝั่งเดียว)']}</div>
            </td>
            <td style="color:#f97316; font-weight:bold">${item['รวมต่อวัน'].toLocaleString()}</td>
            <td>${item['Car'].toLocaleString()}</td>
            <td>${item['Motorcycle'].toLocaleString()}</td>
            <td>${item['Truck'].toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    });

    // Initialize Map centered on Khon Kaen
    const map = L.map('map', {
        center: [16.4322, 102.8236], 
        zoom: 13,
        zoomControl: true
    });

    // ==========================================
    // 1. Base Maps
    // ==========================================
    const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    const lightTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    });

    const satTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri &mdash; Source: Esri...',
        maxZoom: 19
    });

    // ==========================================
    // 2. Overlays
    // ==========================================
    const tomtomApiKey = '8oHwI99AzpDA013yabYCuqOfZ4ffAW6t';
    const tomtomTrafficTiles = L.tileLayer(`https://{s}.api.tomtom.com/traffic/map/4/tile/flow/absolute/{z}/{x}/{y}.png?key=${tomtomApiKey}`, {
        subdomains: ['a', 'b', 'c', 'd'],
        maxZoom: 18,
        opacity: 0.8,
        attribution: '&copy; TomTom'
    }).addTo(map);

    // Heatmap (รัศมีกว้าง)
    let heatLayer = L.heatLayer([], {
        radius: 65, 
        blur: 45, 
        maxZoom: 14,
        gradient: {0.2: 'blue', 0.4: 'cyan', 0.6: 'lime', 0.8: 'yellow', 1.0: 'red'}
    }).addTo(map);

    const liveMarkers = [];
    const sensorLayerGroup = L.layerGroup();
    
    // สร้างหมุดเริ่มต้น
    trafficData.forEach((item, index) => {
        let routeName = item['เส้นทาง'] || item['text'];
        
        // ใช้โครงสร้าง HTML ใหม่: มีวงกลม (dot) และข้อความ (text)
        const customIcon = L.divIcon({
            className: 'custom-sensor-icon',
            html: `
                <div class="sensor-marker">
                    <div class="sensor-dot"></div>
                    <div class="sensor-text">${item['คัน/ชั่วโมง'].toLocaleString()} คัน</div>
                </div>
            `,
            iconSize: [100, 20],
            iconAnchor: [6, 6] // จุดยึดแผนที่คือ กึ่งกลางของจุดวงกลม (ขนาด 12x12)
        });

        const marker = L.marker([item.Lat, item.Lag], { icon: customIcon });

        const popupContent = `
            <div class="popup-title">${routeName}</div>
            <div style="font-size: 0.85rem; margin-bottom:8px; color:#94a3b8">${item['ตำแหน่งติดตั้งเครื่องวัด (ตั้งกล้องนับถนนฝั่งเดียว)']}</div>
            <div class="popup-data" id="popup-live-val-${index}">คัน/ชั่วโมง (ปัจจุบัน): <span>${item['คัน/ชั่วโมง'].toLocaleString()}</span></div>
            <div class="popup-data">เฉลี่ยรายชั่วโมงของจุดนี้: <span>${item['คัน/ชั่วโมง'].toLocaleString()}</span></div>
            <div class="popup-data">รวมต่อวัน: <span>${item['รวมต่อวัน'].toLocaleString()}</span></div>
        `;
        marker.bindPopup(popupContent);
        sensorLayerGroup.addLayer(marker);

        liveMarkers.push({
            markerObject: marker,
            baseHourlyCount: item['คัน/ชั่วโมง'],
            index: index
        });
    });
    sensorLayerGroup.addTo(map);

    // ==========================================
    // 3. Layer Control
    // ==========================================
    const baseMaps = {
        "🗺️ Dark Mode (มืด)": darkTiles,
        "🗺️ Light Mode (สว่าง)": lightTiles,
        "🌍 Satellite (ดาวเทียม)": satTiles
    };
    
    const overlayMaps = {
        "🔴 TomTom Live Traffic": tomtomTrafficTiles,
        "🔥 Simulated Heatmap (24h)": heatLayer,
        "🔢 Live Traffic Numbers": sensorLayerGroup
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false, position: 'topright' }).addTo(map);

    // ==========================================
    // 4. Animation Setup
    // ==========================================
    const hourlyMultipliers = [
        0.15, 0.08, 0.05, 0.1, 0.25, 
        0.55, 1.25, 1.85, 1.55, 1.05,   
        1.0, 1.2, 1.35, 1.25, 1.05,   
        1.25, 1.85, 2.1, 1.6, 1.15,   
        0.85, 0.65, 0.45, 0.25         
    ];

    let currentHour = 0;

    function updateSimulation(hour) {
        const multiplier = hourlyMultipliers[hour];
        
        // Update Heatmap
        const heatData = trafficData.map(item => {
            let intensity = (item['คัน/ชั่วโมง'] * multiplier) / 10000; 
            if (intensity > 1) intensity = 1; 
            return [item.Lat, item.Lag, intensity];
        });
        heatLayer.setLatLngs(heatData);

        // Update Text and Dots
        liveMarkers.forEach(liveItem => {
            const currentTraffic = Math.round(liveItem.baseHourlyCount * multiplier);
            
            // ใส่ class 'heavy' ถ้าปริมาณรถมากเกินระดับที่กำหนด
            let trafficClass = multiplier >= 1.7 ? "heavy" : "";

            const updatedIcon = L.divIcon({
                className: 'custom-sensor-icon',
                html: `
                    <div class="sensor-marker ${trafficClass}">
                        <div class="sensor-dot"></div>
                        <div class="sensor-text">${currentTraffic.toLocaleString()} คัน</div>
                    </div>
                `,
                iconSize: [100, 20],
                iconAnchor: [6, 6] // คงจุดยึดไว้ที่กึ่งกลางวงกลม
            });
            
            liveItem.markerObject.setIcon(updatedIcon);

            // Update Popup text
            if(liveItem.markerObject.isPopupOpen()) {
                const livePopupValEl = document.getElementById(`popup-live-val-${liveItem.index}`);
                if(livePopupValEl) {
                    livePopupValEl.innerHTML = `คัน/ชั่วโมง (ปัจจุบัน): <span style="color: ${multiplier >= 1.7 ? '#ff3d00':'#f97316'}">${currentTraffic.toLocaleString()}</span>`;
                }
            }
        });

        // Update Clock Display
        const displayHour = hour.toString().padStart(2, '0') + ":00";
        document.getElementById('clock-display').innerText = displayHour;
    }

    setInterval(() => {
        updateSimulation(currentHour);
        currentHour++;
        if (currentHour > 23) currentHour = 0;
    }, 1500);

    updateSimulation(currentHour);

</script>
</body>
</html>
